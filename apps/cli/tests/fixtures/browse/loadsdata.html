<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Loads Data</title></head>
<body>
<ul id="offices"></ul>
<script>
  fetch("loadsdata.json").then((r) => r.json()).then((rows) => {
    document.getElementById("offices").innerHTML = rows.map((row) => `<li>${row.name}</li>`).join("");
  });
</script>
</body>
</html>
