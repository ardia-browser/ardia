<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fixture Hold Challenge</title>
<style>
  body { margin: 0; font: 16px system-ui; }
  #challenge { position: absolute; left: 40px; top: 60px; width: 300px; height: 80px; }
</style>
</head>
<body>
<div id="challenge"></div>
<pre id="report" style="margin-top: 160px">{"held":null}</pre>
<script>
  const frame = document.createElement("iframe");
  frame.title = "Hold challenge";
  frame.style.cssText = "width: 300px; height: 80px; border: 0; display: block";
  frame.srcdoc = `<body style="margin:0"><button id="hold" style="width:300px;height:80px">Press and hold</button><script>
    let pressed = 0;
    const hold = document.getElementById("hold");
    hold.addEventListener("mousedown", () => { pressed = performance.now(); });
    hold.addEventListener("mouseup", () => { if (pressed) parent.postMessage(Math.round(performance.now() - pressed), "*"); });
  <\/script></body>`;
  document.getElementById("challenge").attachShadow({ mode: "closed" }).appendChild(frame);
  addEventListener("message", (event) => { document.getElementById("report").textContent = JSON.stringify({ held: event.data }); });
</script>
</body>
</html>
