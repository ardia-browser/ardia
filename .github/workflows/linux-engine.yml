name: Linux engine

on:
  push:
    branches: [linux, linux-dev]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prebuilt engine
        id: prebuilt
        run: |
          if [ -f scripts/linux/engine/prebuilt.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            jq -r '"engine: \(.release), Chromium \(.chromium)"' scripts/linux/engine/prebuilt.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Linux engine has been published yet (scripts/linux/engine/prebuilt.json): nothing to package." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.prebuilt.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - if: steps.prebuilt.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: System packages
        if: steps.prebuilt.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xfwm4 dbus-x11 libxtst6 libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libcups2t64 libxkbcommon0 libsecret-1-0 jq x11-utils
      - if: steps.prebuilt.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck the engine backend
        if: steps.prebuilt.outputs.present == 'true'
        run: pnpm -C apps/browser/linux typecheck:chromium
      - name: Fetch the engine
        if: steps.prebuilt.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/linux/fetch-engine.sh ${{ matrix.arch }} "$RUNNER_TEMP/engine/ardia-chromium-linux-${{ matrix.arch }}.tar.xz"
      - name: Build the engine UI
        if: steps.prebuilt.outputs.present == 'true'
        run: pnpm -C apps/browser/linux build:ui:chromium
      - name: Package
        if: steps.prebuilt.outputs.present == 'true'
        run: |
          node scripts/linux/package-engine.mjs --arch ${{ matrix.arch }} --target all \
            --engine "$RUNNER_TEMP/engine/ardia-chromium-linux-${{ matrix.arch }}.tar.xz" --ui apps/browser/linux/ui-chromium \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the .deb
        if: steps.prebuilt.outputs.present == 'true'
        run: |
          deb=$(ls apps/browser/linux/dist/engine/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'opt/Ardia/(ardia|ardia.bin|chrome-sandbox|ardia.build.json|ui/index.html)$'
          dpkg-deb -c "$deb" | grep -E '^-rwsr-xr-x root/root .* \./opt/Ardia/chrome-sandbox$'
          dpkg-deb -e "$deb" "$RUNNER_TEMP/deb-control"
          grep -q 'chmod 4755' "$RUNNER_TEMP/deb-control/postinst"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          grep -q '^StartupWMClass=ardia$' "$RUNNER_TEMP"/deb-root/usr/share/applications/ardia.desktop
          ! find "$RUNNER_TEMP/deb-root/opt/Ardia/ui" -name '*.map' | grep -q .
      - name: Engine smoke
        if: steps.prebuilt.outputs.present == 'true'
        timeout-minutes: 10
        run: |
          node scripts/linux/package-engine.mjs --arch ${{ matrix.arch }} --target dir --out "$RUNNER_TEMP/engine-dir" \
            --engine "$RUNNER_TEMP/engine/ardia-chromium-linux-${{ matrix.arch }}.tar.xz" --ui apps/browser/linux/ui-chromium
          dir=$(ls -d "$RUNNER_TEMP"/engine-dir/*/)
          touch "$dir/ardia.test-build"
          scripts/linux/engine-smoke --engine "$dir" --ui apps/browser/linux/ui-chromium --out "$RUNNER_TEMP/engine-smoke"
      - if: ${{ !cancelled() && steps.prebuilt.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/engine-smoke
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.prebuilt.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-engine-linux-${{ matrix.arch }}
          path: |
            apps/browser/linux/dist/engine/*.AppImage
            apps/browser/linux/dist/engine/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
