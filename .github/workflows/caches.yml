name: Caches

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted and delete nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: caches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        shell: bash
        run: >-
          node scripts/ci/prune-caches.mjs $DRY_RUN
          --drop-prefix ardia-test-tsx-1-of-8-
          --drop-prefix ardia-test-tsx-2-of-8-
          --drop-prefix ardia-test-tsx-3-of-8-
          --drop-prefix ardia-test-tsx-4-of-8-
          --drop-prefix ardia-test-tsx-5-of-8-
          --drop-prefix ardia-test-tsx-6-of-8-
          --drop-prefix ardia-test-tsx-7-of-8-
          --drop-prefix ardia-test-tsx-8-of-8-
          --drop-prefix ardia-test-tsx-1-of-3-
          --drop-prefix ardia-test-tsx-2-of-3-
          --drop-prefix ardia-test-tsx-3-of-3-
          --newest-only xcode-cas-release-
          --newest-only xcode-cas-ios-
          --newest-only xcode-cas-phone-release-
          --newest-only xcode-cas-mac-
          --newest-only windows-app-x64-
          --newest-only windows-app-arm64-
          --newest-only swiftpm-xcode-
          --newest-only phone-pods-
          --newest-only pods-
          --main-only gradle-phone-
          --newest-only gradle-phone-
          --newest-only turbo-
          --newest-only ardia-test-tsx-1-of-6-
          --newest-only ardia-test-tsx-2-of-6-
          --newest-only ardia-test-tsx-3-of-6-
          --newest-only ardia-test-tsx-4-of-6-
          --newest-only ardia-test-tsx-5-of-6-
          --newest-only ardia-test-tsx-6-of-6- | tee -a "$GITHUB_STEP_SUMMARY"
