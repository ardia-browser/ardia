<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fixture Signup Popup</title>
<style>
  body { margin: 0; font: 16px system-ui; }
  #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 50; }
  #modal { position: fixed; top: 80px; left: 60px; width: 360px; padding: 20px; background: #fff; z-index: 51; }
  #buy { margin: 140px 0 0 120px; }
</style>
</head>
<body>
<button id="buy">Add to bag</button>
<pre id="report">{"clicked":[]}</pre>
<div class="needsclick klaviyo-form" id="popup">
  <div id="shade"></div>
  <div id="modal" class="needsclick" role="dialog" aria-label="Signup form">
    <p>Get 15% off your first order when you join our list.</p>
    <input type="email" placeholder="Email address">
    <button id="join">Unlock my offer</button>
    <button id="close" aria-label="Close dialog">×</button>
  </div>
</div>
<script>
  const state = { clicked: [] };
  document.getElementById("close").addEventListener("click", () => { state.closed = true; document.getElementById("popup").remove(); document.getElementById("report").textContent = JSON.stringify(state); });
  document.getElementById("join").addEventListener("click", () => { state.joined = true; document.getElementById("report").textContent = JSON.stringify(state); });
  document.getElementById("buy").addEventListener("click", () => { state.clicked.push("buy"); document.getElementById("report").textContent = JSON.stringify(state); });
</script>
</body>
</html>
