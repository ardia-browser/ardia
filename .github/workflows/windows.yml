name: Windows

on:
  pull_request:
    paths:
      - "apps/browser/src/**"
      - "apps/browser/windows/Ardia/Ardia.ico"
      - "packages/*/src/**"
      - "!packages/phone/**"
      - "apps/browser/package.json"
      - "packages/core-rs/Cargo.toml"
      - "packages/core-rs/Cargo.lock"
      - "packages/core-rs/rust-toolchain.toml"
      - "packages/core-rs/crates/ardia-crypto/**"
      - "packages/core-rs/crates/ardia-update-core/**"
      - "packages/core-rs/crates/ardia-update-verify/**"
      - "apps/desktop/**"
      - "packages/core-rs/crates/ardia-shell-migration/**"
      - "scripts/windows/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "apps/browser/src/**"
      - "apps/browser/windows/Ardia/Ardia.ico"
      - "packages/*/src/**"
      - "!packages/phone/**"
      - "apps/browser/package.json"
      - "packages/core-rs/Cargo.toml"
      - "packages/core-rs/Cargo.lock"
      - "packages/core-rs/rust-toolchain.toml"
      - "packages/core-rs/crates/ardia-crypto/**"
      - "packages/core-rs/crates/ardia-update-core/**"
      - "packages/core-rs/crates/ardia-update-verify/**"
      - "apps/desktop/**"
      - "packages/core-rs/crates/ardia-shell-migration/**"
      - "scripts/windows/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version; set, the run also names the installers Ardia-<version>-windows-<cpu>-setup.exe and packs the engine's source, as the artifacts windows-release-x64, windows-release-arm64 and windows-release-source
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: Release version the installers and the engine's source are named for
        type: string
        required: true
    outputs:
      version:
        description: The version stamped in Ardia.build.json
        value: ${{ jobs.identity.outputs.version }}
      build:
        description: The build number stamped in Ardia.build.json
        value: ${{ jobs.identity.outputs.build }}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.vouch.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - id: vouch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const vouch = require(`${process.env.GITHUB_WORKSPACE}/.github/vouch/vouch.cjs`);
            await vouch.gate({ github, context, core });

  identity:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.run == 'true')) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build: ${{ steps.identity.outputs.build }}
      full: ${{ steps.depth.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: apps/browser/macos/Ardia.xcodeproj/project.pbxproj
          sparse-checkout-cone-mode: false
      - id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          project=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};.*/\1/p' apps/browser/macos/Ardia.xcodeproj/project.pbxproj | head -1)
          version="${RELEASE_VERSION:-$project}"
          [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]{0,63}$ ]] || { echo "::error::'$version' isn't a version the updater reads"; exit 1; }
          build=$(git rev-list --count HEAD)
          { echo "version=$version"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
          echo "Ardia $version, Windows build $build (the commits in $(git rev-parse --short HEAD)'s history)" >> "$GITHUB_STEP_SUMMARY"
      - id: depth
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            let full = context.eventName !== "pull_request";
            if (!full) {
              const firstAttempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1) === 1;
              const pr = firstAttempt
                ? context.payload.pull_request
                : (await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number })).data;
              full = (pr.labels || []).some((label) => label.name === "full-ci");
            }
            core.setOutput("full", full ? "true" : "false");
            core.info(full ? "Full run: compile, tours and installers." : "Fast run: reuse a built app when the native code is unchanged, then launch it.");

  source:
    needs: identity
    if: ${{ !cancelled() && needs.identity.result == 'success' && inputs.version }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/windows
      - name: Pack the engine's source
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          BUILD: ${{ needs.identity.outputs.build }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/source/Ardia-$VERSION-windows-source.tar.xz"
          mkdir -p "$(dirname "$out")"
          scripts/windows/engine-source.sh "$GITHUB_SHA" "$VERSION" "$BUILD" "$out"
          (cd "$(dirname "$out")" && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          echo "- Windows engine source: $(basename "$out"), $(du -h "$out" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release-source
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  webui:
    needs: [gate, identity]
    if: ${{ !cancelled() && needs.identity.result == 'success' && (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.run == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SLUG: x64
      TOUR: "true"
      FULL: ${{ needs.identity.outputs.full }}
      VERSION: ${{ needs.identity.outputs.version }}
      BUILD: ${{ needs.identity.outputs.build }}
      MIGRATOR: packages/core-rs/target/release/ardia-webui-migrate.exe
    steps: &webui_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the shell layouts, the WebUI assembly and the installer's refusals
        if: env.SLUG == 'x64'
        shell: pwsh
        run: scripts/windows/shell-layout.test.ps1
      - name: Check the pilot's waits, log and types on PowerShell 7
        if: env.SLUG == 'x64'
        shell: pwsh
        run: scripts/windows/webui-pilot/wait.test.ps1
      - name: Check the pilot's waits, log and types on Windows PowerShell
        if: env.SLUG == 'x64'
        shell: powershell
        run: scripts/windows/webui-pilot/wait.test.ps1
      - name: Check the PE import reader
        if: env.SLUG == 'x64'
        shell: pwsh
        run: scripts/windows/pe-imports.test.ps1
      - name: Check the Windows update verifier packaging script
        if: env.SLUG == 'x64'
        shell: pwsh
        run: scripts/windows/update-verify.test.ps1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Install the packages, again after a failure that may be the network or a locked file
        shell: pwsh
        run: |
          $attempts = 3
          foreach ($attempt in 1..$attempts) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $attempts) {
              $wait = 15 * $attempt
              Write-Host "::warning::pnpm install failed with exit code $LASTEXITCODE on attempt $attempt of $attempts; trying again in $wait s"
              Start-Sleep -Seconds $wait
            }
          }
          Write-Host "::error::pnpm install failed $attempts times"
          exit 1
      - name: Build the desktop UI for Windows
        run: pnpm -C apps/desktop build:win
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            packages/core-rs/target
          key: webui-migrate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/core-rs/rust-toolchain.toml', 'packages/core-rs/Cargo.lock') }}
          restore-keys: webui-migrate-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the migrator
        shell: bash
        working-directory: packages/core-rs
        run: rustup toolchain install && cargo build --locked --release -p ardia-shell-migration --bin ardia-webui-migrate
      - name: Build the update verifier
        shell: pwsh
        run: scripts/windows/update-verify.ps1 -Cpu $env:SLUG -Out "${{ runner.temp }}/update-verify"
      - name: Fetch the engine
        id: engine
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/windows/fetch-engine.ps1 -Cpu $env:SLUG -Out "${{ runner.temp }}/engine"
      - name: Assemble the shippable WebUI build
        id: assemble
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/assemble-webui.ps1 -Engine "${{ runner.temp }}/engine" -Ui apps/desktop/dist/win -Out "${{ runner.temp }}/ArdiaWebUI" -MigrateBin $env:MIGRATOR -UpdateVerify "${{ runner.temp }}/update-verify/ardia-update-verify.exe" -Shippable -Version $env:VERSION -Build $env:BUILD
      - name: Every DLL the WebUI build needs is in it or in a clean Windows 11
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/dependency-check.ps1 -App "${{ runner.temp }}/ArdiaWebUI"
      - name: Make the WebUI installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' && env.FULL == 'true' }}
        shell: pwsh
        run: scripts/windows/make-installer.ps1 -Source "${{ runner.temp }}/ArdiaWebUI" -Out "${{ runner.temp }}/installer-webui" -Cpu $env:SLUG -Version $env:VERSION
      - name: Install and uninstall the WebUI build
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/installer-check.ps1 -Setup "${{ runner.temp }}/installer-webui/Ardia-Setup-$env:SLUG.exe"
      - name: Tour the WebUI build
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' && env.FULL == 'true' && env.TOUR == 'true' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $tour = "${{ runner.temp }}/ArdiaWebUI-tour"
          Copy-Item -LiteralPath "${{ runner.temp }}/ArdiaWebUI" -Destination $tour -Recurse
          New-Item -ItemType File -Path (Join-Path $tour "Ardia.test-build") | Out-Null
          scripts/windows/webui-pilot/tour-webui.ps1 -App $tour -Out "${{ runner.temp }}/tour-webui" -RequireFlagless
          $code = $LASTEXITCODE
          if (Test-Path "${{ runner.temp }}/tour-webui/tour-webui.md") { Get-Content "${{ runner.temp }}/tour-webui/tour-webui.md" >> $env:GITHUB_STEP_SUMMARY }
          exit $code
      - name: Check the WebUI test gate
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' && env.TOUR == 'true' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          scripts/windows/webui-pilot/test-gate-check.ps1 -App "${{ runner.temp }}/ArdiaWebUI" -Out "${{ runner.temp }}/test-gate-webui" -RequireRealProfile
          $code = $LASTEXITCODE
          if (Test-Path "${{ runner.temp }}/test-gate-webui/test-gate-webui.md") { Get-Content "${{ runner.temp }}/test-gate-webui/test-gate-webui.md" >> $env:GITHUB_STEP_SUMMARY }
          exit $code
      - name: Name it for a release
        id: release-files
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/release-files.ps1 -Installer "${{ runner.temp }}/installer-webui" -Identity "${{ runner.temp }}/ArdiaWebUI/Ardia.build.json" -Cpu $env:SLUG -Out "${{ runner.temp }}/release"
      - if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-Setup-${{ env.SLUG }}
          path: ${{ runner.temp }}/installer-webui
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - if: ${{ inputs.version && steps.release-files.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release-${{ env.SLUG }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: ${{ !cancelled() && steps.assemble.outcome == 'success' && env.FULL == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-windows-${{ env.SLUG }}
          path: ${{ runner.temp }}/ArdiaWebUI
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.TOUR == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tour-webui
          path: |
            ${{ runner.temp }}/tour-webui
            !${{ runner.temp }}/tour-webui/runs
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.TOUR == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-gate-webui
          path: |
            ${{ runner.temp }}/test-gate-webui
            !${{ runner.temp }}/test-gate-webui/runs
          if-no-files-found: ignore
          retention-days: 14

  webui-arm64:
    needs: [gate, identity]
    if: ${{ !cancelled() && needs.identity.result == 'success' && (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.run == 'true')) }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SLUG: arm64
      TOUR: "false"
      FULL: ${{ needs.identity.outputs.full }}
      VERSION: ${{ needs.identity.outputs.version }}
      BUILD: ${{ needs.identity.outputs.build }}
      MIGRATOR: packages/core-rs/target/release/ardia-webui-migrate.exe
    steps: *webui_steps
