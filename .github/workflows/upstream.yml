name: Upstream pins

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the report and what would change on the tracking issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-pins
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/engine
            engine/patches/build
            scripts/windows/engine
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Compare the pins with upstream and sync the tracking issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/engine/upstream-pins.mjs --issue
