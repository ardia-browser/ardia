name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "typecheck and tests", part: rest }
          - { name: "browser tests, share 1 of 4", part: browser, shard: 1 }
          - { name: "browser tests, share 2 of 4", part: browser, shard: 2 }
          - { name: "browser tests, share 3 of 4", part: browser, shard: 3 }
          - { name: "browser tests, share 4 of 4", part: browser, shard: 4 }
          - { name: "Mac bundle", part: bundle }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: matrix.part == 'rest'
        run: pnpm typecheck
      - name: Tests that need no Mac, the browser's aside
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: pnpm run test:portable:packages --filter=!@ardia/browser
      - name: The tests of the Mac packages that need no Mac
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: pnpm run test:portable:mac
      - name: Repository tests
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: pnpm run test:root
      - name: This share of the browser's tests
        if: matrix.part == 'browser'
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
        run: pnpm --filter @ardia/browser test
      - name: Bundle the Mac app's JavaScript as a release build does
        if: matrix.part == 'bundle'
        working-directory: apps/browser
        run: |
          npx react-native bundle --platform macos --entry-file index.js --dev false --minify false --reset-cache --bundle-output "$RUNNER_TEMP/main.jsbundle" --assets-dest "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/main.jsbundle"
      - name: Compile the bundle with Hermes
        if: matrix.part == 'bundle'
        run: |
          hermesc=$(find node_modules -path '*linux64-bin/hermesc' -type f | head -1)
          [ -n "$hermesc" ] || { echo "::error::no Linux hermesc under node_modules"; exit 1; }
          echo "compiling with $hermesc"
          "$hermesc" -emit-binary -O -out "$RUNNER_TEMP/main.hbc" "$RUNNER_TEMP/main.jsbundle"
          ls -l "$RUNNER_TEMP/main.hbc"

  native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter=@ardia/ardiacore --filter=@ardia/import --filter=@ardia/shell --filter=@ardia/sync --concurrency=1

  checks:
    if: ${{ always() }}
    needs: [portable, native]
    runs-on: ubuntu-latest
    steps:
      - env:
          PORTABLE: ${{ needs.portable.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$PORTABLE" = success && test "$NATIVE" = success
