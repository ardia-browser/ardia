[package]
name = "ardia-state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardia-profile.workspace = true
ardia-theme.workspace = true
ardia-sync-core = { workspace = true, features = ["rustcrypto"] }
ardia-import-core.workspace = true
ardia-update-core = { workspace = true, features = ["rustcrypto"] }
ardia-shell-migration.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
zeroize.workspace = true
url.workspace = true
percent-encoding = "2"
idna = "1"
parking_lot.workspace = true
indexmap = { version = "2", features = ["serde"] }
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
