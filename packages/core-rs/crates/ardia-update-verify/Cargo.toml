[package]
name = "ardia-update-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ardia-update-verify"
path = "src/main.rs"

[dependencies]
ardia-crypto = { workspace = true, features = ["rustcrypto", "ed25519"] }
ardia-update-core = { workspace = true, features = ["rustcrypto"] }
base64.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = { workspace = true }
serde_json.workspace = true
