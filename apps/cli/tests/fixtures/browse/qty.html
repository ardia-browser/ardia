<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Quantity</title></head>
<body>
<label>Quantity <input id="qty" type="number" value="1"></label>
<p>Total: <span id="total">$2.00</span></p>
<label>Live <input id="live" type="number" value="1"></label>
<p>Live total: <span id="livetotal">$2.00</span></p>
<script>
  document.getElementById("qty").addEventListener("change", (e) => { document.getElementById("total").textContent = "$" + (2 * e.target.value).toFixed(2); });
  document.getElementById("live").addEventListener("input", (e) => { document.getElementById("livetotal").textContent = "$" + (2 * e.target.value).toFixed(2); });
</script>
</body>
</html>
