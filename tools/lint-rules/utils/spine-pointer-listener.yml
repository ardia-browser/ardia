id: spine-pointer-listener
language: rust
rule:
  kind: call_expression
  any:
    - has:
        field: function
        kind: field_expression
        has:
          field: field
          regex: ^(on_mouse_down|on_mouse_up|on_mouse_move|on_mouse_down_out|on_mouse_up_out|on_click|on_drag_move|on_drop|on_drag|drag_over|on_scroll_wheel|on_any_mouse_down|capture_any_mouse_down|capture_any_mouse_up)$
    - has:
        field: function
        kind: field_expression
        has:
          field: value
          matches: spine-pointer-listener
