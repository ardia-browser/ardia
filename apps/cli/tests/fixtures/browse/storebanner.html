<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Store Banner</title>
<style>
  body { margin: 0; font: 16px system-ui; }
  #go { margin: 140px 40px; padding: 12px 24px; }
  #banner { position: fixed; left: 0; right: 0; top: 100px; height: 160px; background: #fde; z-index: 30; padding: 20px; }
</style>
</head>
<body>
<pre id="report">{}</pre>
<button id="go">Find a store</button>
<div id="banner"><p>Our new store opens Friday on Market Street.</p><button id="shut" aria-label="Close">×</button></div>
<script>
  const state = { clicked: [] };
  const show = () => { document.getElementById("report").textContent = JSON.stringify(state); };
  document.getElementById("shut").addEventListener("click", () => { state.closed = true; document.getElementById("banner").remove(); show(); });
  document.getElementById("go").addEventListener("click", () => { state.clicked.push("go"); show(); });
  show();
</script>
</body>
</html>
