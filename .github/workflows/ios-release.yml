name: iOS Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: status lists what App Store Connect holds; dry-run builds and signs the archive and sends nothing to App Store Connect; upload sends the build to TestFlight's Internal group; device registers an iPhone's UDID on the team and builds a development-signed .ipa it can install over a cable; public-link submits a build for Beta App Review and prints the link to share; add-tester invites an email to the Public Testers group; expire ends testing of an older build for good; certificate makes the development certificate CI signs with
        type: choice
        options: [status, dry-run, upload, device, public-link, add-tester, expire, certificate]
        default: status
      build:
        description: Build number (empty takes the one after the highest uploaded)
        type: string
        default: ""
      default_browser:
        description: Sign with the default-browser entitlement (only once Apple has granted it)
        type: boolean
        default: false
      public_testers:
        description: Uploads go to Internal. Use public-link to submit the processed build to Public Testers.
        type: boolean
        default: false
      signing_request:
        description: certificate mode only, the base64 of a certificate signing request
        type: string
        default: ""
      email:
        description: add-tester mode only, the tester's email address
        type: string
        default: ""
      udid:
        description: device mode only, the iPhone's UDID (xcrun devicectl list devices)
        type: string
        default: ""
      version:
        description: Device build version. Leave empty to use the Mac app's MARKETING_VERSION for a USB build or the pinned version for TestFlight.
        type: string
        default: ""
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      version:
        type: string
        default: ""
      build:
        type: string
        default: ""
      default_browser:
        type: boolean
        default: false
      public_testers:
        type: boolean
        default: false
      signing_request:
        type: string
        default: ""
      email:
        type: string
        default: ""
      udid:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  status:
    if: inputs.mode == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -d > "$key")
          trap 'rm -f "$key"' EXIT
          ASC_KEY="$key" node apps/phone/scripts/asc.mjs status | tee -a "$GITHUB_STEP_SUMMARY"

  public-link:
    if: inputs.mode == 'public-link'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Public test link
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          [ -n "$BUILD" ] || { echo "::error::public-link mode needs build"; exit 1; }
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -d > "$key")
          trap 'rm -f "$key"' EXIT
          ASC_KEY="$key" node apps/phone/scripts/asc.mjs public-link --build "$BUILD" \
            --what-to-test apps/phone/ios/Config/TestFlight-WhatToTest.txt --privacy-policy https://ardia.dev/privacy | tee -a "$GITHUB_STEP_SUMMARY"

  add-tester:
    if: inputs.mode == 'add-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Invite tester
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          [ -n "$EMAIL" ] || { echo "::error::add-tester mode needs email"; exit 1; }
          echo "::add-mask::$EMAIL"
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -d > "$key")
          trap 'rm -f "$key"' EXIT
          ASC_KEY="$key" node apps/phone/scripts/asc.mjs add-tester --email "$EMAIL" | tee -a "$GITHUB_STEP_SUMMARY"

  expire:
    if: inputs.mode == 'expire'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Expire build
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          [ -n "$BUILD" ] || { echo "::error::expire mode needs build"; exit 1; }
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -d > "$key")
          trap 'rm -f "$key"' EXIT
          ASC_KEY="$key" node apps/phone/scripts/asc.mjs expire --build "$BUILD" | tee -a "$GITHUB_STEP_SUMMARY"

  certificate:
    if: inputs.mode == 'certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Make the development certificate
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SIGNING_REQUEST: ${{ inputs.signing_request }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_REQUEST" ] || { echo "::error::certificate mode needs signing_request"; exit 1; }
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -d > "$key")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_REQUEST" | base64 -d > "$RUNNER_TEMP/request.csr"
          mkdir -p "$RUNNER_TEMP/certificate"
          ASC_KEY="$key" node apps/phone/scripts/asc.mjs certificates --create "$RUNNER_TEMP/request.csr" --out "$RUNNER_TEMP/certificate/development.cer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-development-certificate
          path: ${{ runner.temp }}/certificate/development.cer
          if-no-files-found: error
          retention-days: 1

  release:
    if: inputs.mode == 'dry-run' || inputs.mode == 'upload' || inputs.mode == 'device'
    runs-on: xcode-27
    timeout-minutes: 120
    concurrency:
      group: ios-release
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      ASC_KEY: ${{ github.workspace }}/.ci/asc/AuthKey.p8
      ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      OUT: ${{ github.workspace }}/.ci/ios-release
      MODE: ${{ inputs.mode }}
      BUILD_INPUT: ${{ inputs.build }}
      DEFAULT_BROWSER: ${{ inputs.default_browser }}
      RELEASE_VERSION: ${{ inputs.version }}
      TESTFLIGHT_VERSION: 1.0.1
    steps:
      - if: inputs.mode == 'device'
        name: Mask the UDID
        run: jq -r '.inputs.udid // empty' "$GITHUB_EVENT_PATH" | sed 's/^/::add-mask::/'
      - if: inputs.mode != 'device'
        name: Use the pinned TestFlight version
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "$TESTFLIGHT_VERSION" ]; then
            echo "::error::Leave version empty for TestFlight. This workflow uses $TESTFLIGHT_VERSION (docs/phone.md)."
            exit 1
          fi
          echo "RELEASE_VERSION=$TESTFLIGHT_VERSION" >> "$GITHUB_ENV"
      - name: Uploads go to the Internal group first
        if: inputs.mode == 'upload' && inputs.public_testers
        run: |
          echo "::error::Upload with public_testers=false. Use public-link after App Store Connect processes the build."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Toolchain
        run: xcodebuild -version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: The Expo app's dependencies and Pods
        run: |
          set -euo pipefail
          (cd apps/phone && pnpm install --frozen-lockfile)
          (cd apps/phone/ios && LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install)
          git diff --exit-code -- apps/phone/ios/Podfile.lock || { echo "::error::pod install changed apps/phone/ios/Podfile.lock: commit the lockfile pod install writes"; exit 1; }
          git diff --exit-code -- apps/phone/ios ':!apps/phone/ios/Pods' || { echo "::error::pod install rewrote the iPhone project (diff above): run pod install locally and commit what it writes"; exit 1; }
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ASC_KEY")" && chmod 700 "$(dirname "$ASC_KEY")"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -D > "$ASC_KEY")
          grep -q 'BEGIN PRIVATE KEY' "$ASC_KEY" || { echo "::error::NOTARY_KEY_P8 isn't a base64 .p8 key"; exit 1; }
          node apps/phone/scripts/asc.mjs certificates --save "$(dirname "$ASC_KEY")/certificates.json"
      - name: Development certificate
        env:
          IOS_DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$IOS_DEVELOPMENT_P12" ] && [ -n "$IOS_DEVELOPMENT_P12_PASSWORD" ] || { echo "::error::missing secrets IOS_DEVELOPMENT_P12 and IOS_DEVELOPMENT_P12_PASSWORD (docs/phone.md)"; exit 1; }
          secrets="$(dirname "$ASC_KEY")"
          keychain="$secrets/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$IOS_DEVELOPMENT_P12" | base64 -D > "$secrets/development.p12")
          security import "$secrets/development.p12" -k "$keychain" -f pkcs12 -P "$IOS_DEVELOPMENT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$secrets/development.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          others="$(security list-keychains -d user | tr -d '"' | grep -v "^ *$keychain$" | xargs)"
          read -r -a others_list <<<"$others"
          security list-keychains -d user -s "$keychain" ${others_list[@]+"${others_list[@]}"}
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Development: ' \
            || { echo "::error::the stored certificate isn't a valid Apple Development identity: $(security find-identity -v -p codesigning "$keychain" | tail -1)"; exit 1; }
      - id: plan
        name: Build number
        run: |
          set -euo pipefail
          build="$BUILD_INPUT"
          [ -n "$build" ] || build="$(node apps/phone/scripts/asc.mjs next-build)"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### Ardia for iPhone ${RELEASE_VERSION:-from MARKETING_VERSION}, build $build ($MODE)" >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.mode == 'device'
        name: Register the iPhone
        env:
          UDID: ${{ inputs.udid }}
        run: |
          set -euo pipefail
          [ -n "$UDID" ] || { echo "::error::device mode needs udid"; exit 1; }
          node apps/phone/scripts/asc.mjs register-device --udid "$UDID"
      - name: Archive, sign${{ inputs.mode == 'upload' && ', upload' || '' }}
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -euo pipefail
          args=("$BUILD" --out "$OUT")
          [ -z "$RELEASE_VERSION" ] || args+=(--version "$RELEASE_VERSION")
          if [ "$MODE" = device ]; then args+=(--development); elif [ "$MODE" != upload ]; then args+=(--no-upload); fi
          [ "$DEFAULT_BROWSER" != true ] || args+=(--default-browser)
          apps/phone/scripts/release-ios "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: inputs.mode == 'upload'
        name: Wait for App Store Connect to process the build
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -euo pipefail
          node apps/phone/scripts/asc.mjs wait --build "$BUILD" --timeout 2400 | tee -a "$GITHUB_STEP_SUMMARY"
      - if: inputs.mode == 'upload' && inputs.public_testers
        name: Send the build to public testers
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -euo pipefail
          node apps/phone/scripts/asc.mjs public-link --build "$BUILD" \
            --what-to-test apps/phone/ios/Config/TestFlight-WhatToTest.txt --privacy-policy https://ardia.dev/privacy | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: No certificate was made
        run: |
          snapshot="$(dirname "$ASC_KEY")/certificates.json"
          [ ! -f "$snapshot" ] || node apps/phone/scripts/asc.mjs certificates --new-since "$snapshot" \
            || echo "::error::this run made a development certificate instead of signing with the stored one; it is still on the team"
      - if: always()
        name: Remove the key
        run: |
          keychain="$(dirname "$ASC_KEY")/signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain" || true; fi
          rm -rf "$(dirname "$ASC_KEY")"
          [ ! -e "$ASC_KEY" ] || { echo "::error::couldn't remove the App Store Connect key"; exit 1; }
      - if: inputs.mode == 'device'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-device-build
          path: ${{ github.workspace }}/.ci/ios-release/export/*.ipa
          if-no-files-found: error
          retention-days: 3
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release-logs
          path: |
            ${{ github.workspace }}/.ci/ios-release/*.log
            ${{ github.workspace }}/.ci/ios-release/export/*.plist
            ${{ github.workspace }}/.ci/ios-release/bundle/stamp.plist
          if-no-files-found: ignore
          retention-days: 14
