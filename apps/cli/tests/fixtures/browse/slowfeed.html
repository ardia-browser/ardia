<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Slow Feed</title>
<style>body { margin: 0; font: 16px system-ui; } li { height: 40px; } #sentinel { height: 1px; }</style>
</head>
<body>
<h1>Makers</h1>
<ul id="feed"></ul>
<div id="sentinel"></div>
<script>
  const feed = document.getElementById("feed");
  let count = 0;
  let loading = false;
  const batch = () => {
    for (let i = 0; i < 100; i++) {
      count++;
      const item = document.createElement("li");
      item.textContent = `Maker ${count}`;
      feed.appendChild(item);
    }
  };
  batch();
  new IntersectionObserver((entries) => {
    if (!entries[0].isIntersecting || loading || count >= 500) return;
    loading = true;
    setTimeout(() => { batch(); loading = false; }, 1200);
  }).observe(document.getElementById("sentinel"));
</script>
</body>
</html>
