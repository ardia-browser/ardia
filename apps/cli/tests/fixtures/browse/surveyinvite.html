<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Survey Invite</title>
<style>
  body { margin: 0; font: 16px system-ui; }
  #go { margin: 120px 40px; padding: 12px 24px; }
  #kampyleInviteContainer { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #kampyleInviteContainer .box { background: #fff; padding: 24px; width: 320px; }
</style>
</head>
<body>
<pre id="report">{}</pre>
<button id="go">Show results</button>
<div id="kampyleInviteContainer"><div class="box"><p>We'd love to hear what you think of our site.</p><button id="yes">Sure</button> <button id="no">No thanks</button></div></div>
<script>
  const state = { clicked: [] };
  const show = () => { document.getElementById("report").textContent = JSON.stringify(state); };
  document.getElementById("no").addEventListener("click", () => { state.survey = "declined"; document.getElementById("kampyleInviteContainer").remove(); show(); });
  document.getElementById("yes").addEventListener("click", () => { state.survey = "accepted"; show(); });
  document.getElementById("go").addEventListener("click", () => { state.clicked.push("go"); show(); });
  show();
</script>
</body>
</html>
