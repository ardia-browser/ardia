name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'closed' || github.event.pull_request.merged)) ||
      (github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
       (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    concurrency:
      group: cla-${{ (github.event_name == 'issue_comment' || github.event.action == 'closed') && github.run_id || github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action != 'closed' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const cla = require(`${process.env.GITHUB_WORKSPACE}/.github/cla/cla.cjs`);
            await cla.run({ github, context, core });
