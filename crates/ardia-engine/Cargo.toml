[package]
name = "ardia-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ardia-profile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
log.workspace = true
futures.workspace = true
zeroize.workspace = true
smallvec.workspace = true
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cc.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSGraphics", "NSMenu", "NSResponder", "NSRunningApplication", "NSWindow"] }

[[test]]
name = "framework_load"
path = "tests/framework_load.rs"
harness = false

[[test]]
name = "appkit_main_thread"
path = "tests/appkit_main_thread.rs"
harness = false

[lints]
workspace = true
