[package]
name = "ardia-update-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ardia_update"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["rustcrypto"]
rustcrypto = ["ardia-update-core/rustcrypto", "ardia-crypto/rustcrypto"]

[dependencies]
ardia-crypto = { workspace = true, features = ["ed25519"] }
ardia-update-core.workspace = true

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
serde_json.workspace = true
