name: Mac packages

on:
  pull_request:
    paths: &packages
      - "packages/ardiacore/**"
      - ".github/workflows/mac-packages.yml"
  push:
    branches: [main]
    paths: *packages

permissions:
  contents: read

concurrency:
  group: mac-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.vouch.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - id: vouch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const vouch = require(`${process.env.GITHUB_WORKSPACE}/.github/vouch/vouch.cjs`);
            await vouch.gate({ github, context, core });

  ardiacore:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.run == 'true')) }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Toolchain
        run: |
          swiftc --version
          clang++ --version
          node --version
      - name: ArdiaCore tests, the vault Swift suites included
        working-directory: packages/ardiacore
        env:
          TMPDIR: ${{ runner.temp }}
          ARDIA_SWIFT_TESTING: required
        run: pnpm run test
