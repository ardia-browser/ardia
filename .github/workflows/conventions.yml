name: Conventions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  conventions:
    name: conventions across the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Conventions, comments, sleeps and dated skips in every file the repository owns
        run: node apps/browser/src/conventions.test.mjs
