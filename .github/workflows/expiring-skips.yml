name: Expiring skips

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expiring-skips
  cancel-in-progress: true

jobs:
  expiry:
    name: skips past their date, as warnings in the summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Skips, todos, quarantines and accepted risks still in date
        run: node apps/browser/src/conventions.test.mjs --expired --summary "$GITHUB_STEP_SUMMARY"
