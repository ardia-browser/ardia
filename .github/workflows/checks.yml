name: Checks

on:
  pull_request:
    paths: &inputs
      - ".gitattributes"
      - "apps/browser/**"
      - "apps/linux/**"
      - "apps/site/**"
      - "apps/phone/scripts/**"
      - "apps/ios/**"
      - "apps/cli/**"
      - "packages/**"
      - "engine/**"
      - "scripts/**"
      - "extras/**"
      - "tests/**"
      - "docs/plugin.schema.json"
      - "docs/plugins.md"
      - "docs/engine-build.md"
      - "docs/release-notes/**"
      - "infra/site/**"
      - ".claude/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - "patches/**"
  push:
    branches: [main]
    paths: *inputs

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: which checks run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target: ${{ steps.route.outputs.target }}
      code: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.code == 'true' }}
      browser: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.browser == 'true' }}
      repo: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.repo == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name != 'pull_request' || github.event.pull_request.changed_files < 3000
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            code:
              - ".gitattributes"
              - "apps/browser/**"
              - "apps/linux/**"
              - "apps/phone/scripts/**"
              - "apps/site/src/assets/**"
              - "apps/site/src/scripts/meadowApp.ts"
              - "apps/site/src/scripts/meadow/**"
              - "apps/site/src/data/heroPoster.ts"
              - "apps/site/src/data/heroFrames.mjs"
              - "packages/**"
              - "engine/ardiacore/src/**"
              - "engine/ardiacore-linux/src/ardia/linux/ac_linux_contract.h"
              - "engine/patches/**"
              - "docs/engine-build.md"
              - "scripts/lib/**"
              - "scripts/security/**"
              - "tests/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - ".nvmrc"
              - "patches/**"
              - ".github/workflows/checks.yml"
            browser:
              - "apps/browser/**"
              - "apps/linux/src/**"
              - "apps/linux/package.json"
              - "apps/site/public/switches.json"
              - "packages/**"
              - "engine/ardiacore/src/**"
              - "engine/chromium/src/**"
              - "engine/ardiacore-linux/content-blocker/**"
              - "scripts/lib/**"
              - "scripts/security/**"
              - "scripts/windows/**"
              - "tests/**"
              - "docs/plugin.schema.json"
              - "docs/plugins.md"
              - ".github/workflows/windows.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - ".nvmrc"
              - "patches/**"
              - ".github/workflows/checks.yml"
            repo:
              - "scripts/**"
              - "extras/**"
              - "apps/ios/**"
              - "apps/site/**"
              - "apps/cli/**"
              - "apps/linux/scripts/**"
              - "apps/browser/official-plugins.json"
              - "apps/browser/official-plugins-history.json"
              - "packages/ardiacore/ios/ArdiaLaunchConfig.mm"
              - "packages/sync/ios/Core/LegacyMigration.swift"
              - "packages/ardiacore/ios/page_script.js"
              - "packages/ardiacore/prebuilt-engines.tsv"
              - "packages/ardiacore/prebuilt-engines-linux.tsv"
              - "packages/ardiacore/scripts/**"
              - "packages/shaders/scripts/meadow.mjs"
              - "apps/browser/assets/offline-game/**"
              - "apps/browser/assets/offline-game-pipeline/**"
              - "engine/**"
              - "docs/release-notes/**"
              - "infra/site/**"
              - ".claude/**"
              - ".github/**"
              - "package.json"
              - ".nvmrc"
      - name: The router, from main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || 'main' }}
          path: .route
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/
            /.github/TEAM.td
            /.github/vouch/vouch.cjs
      - id: route
        name: GitHub or Boat for the long jobs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOAT_CI_LIMITS_KEY: ${{ secrets.BOAT_CI_LIMITS_KEY }}
          BOAT_OVERFLOW_VARS: ${{ toJSON(vars) }}
        run: node .route/scripts/ci/route-runner.mjs --fallback ubuntu-latest --jobs 4

  check:
    name: typecheck, tests and Mac bundle
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    concurrency:
      group: checks-code-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ github.run_attempt == '1' && needs.changes.result == 'success' && needs.changes.outputs.target == 'boat' && 'boat-large' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests that need no Mac, the browser's aside
        if: ${{ !cancelled() }}
        run: pnpm run test:portable:packages --filter=!@ardia/browser
      - name: The tests of the Mac packages that need no Mac
        if: ${{ !cancelled() }}
        run: pnpm run test:portable:mac
      - name: Store simulator, the CI seed set
        if: ${{ !cancelled() }}
        run: pnpm --filter @ardia/browser sim
      - name: Bundle the Mac app's JavaScript as a release build does
        id: bundle
        if: ${{ !cancelled() }}
        working-directory: apps/browser
        run: |
          npx react-native bundle --platform macos --entry-file index.js --dev false --minify false --reset-cache --bundle-output "$RUNNER_TEMP/main.jsbundle" --assets-dest "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/main.jsbundle"
      - name: Compile the bundle with Hermes
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          hermesc=$(find node_modules -path '*linux64-bin/hermesc' -type f | head -1)
          [ -n "$hermesc" ] || { echo "::error::no Linux hermesc under node_modules"; exit 1; }
          echo "compiling with $hermesc"
          "$hermesc" -emit-binary -O -out "$RUNNER_TEMP/main.hbc" "$RUNNER_TEMP/main.jsbundle"
          ls -l "$RUNNER_TEMP/main.hbc"

  browser:
    name: browser tests, share ${{ matrix.shard }} of 3
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    concurrency:
      group: checks-browser-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ github.run_attempt == '1' && needs.changes.result == 'success' && needs.changes.outputs.target == 'boat' && 'boat-large' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The TSX this share transpiled last time
        id: tsx
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/node_modules/.cache/ardia-test-tsx
          key: ardia-test-tsx-${{ matrix.shard }}-of-3-${{ hashFiles('apps/browser/src/test-loader.mjs', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ardia-test-tsx-${{ matrix.shard }}-of-3-${{ hashFiles('apps/browser/src/test-loader.mjs', 'pnpm-lock.yaml') }}-
      - name: The uBlock Origin release ubo.sh pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/node_modules/.cache/ublock/*.zip
          key: ublock-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - name: This share of the browser's tests
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/3
        run: pnpm --filter @ardia/browser test
      - name: Keep the TSX for the next run on main
        if: ${{ !cancelled() && github.event_name == 'push' && steps.tsx.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/node_modules/.cache/ardia-test-tsx
          key: ardia-test-tsx-${{ matrix.shard }}-of-3-${{ hashFiles('apps/browser/src/test-loader.mjs', 'pnpm-lock.yaml') }}-${{ github.sha }}

  repo:
    name: repository, vouch and stale tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.repo == 'true') }}
    concurrency:
      group: checks-repo-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Repository tests
        run: node --run test:root
      - name: Vouch and stale tests
        if: ${{ !cancelled() }}
        run: node --test .github/vouch/vouch.test.cjs .github/stale/stale.test.cjs
