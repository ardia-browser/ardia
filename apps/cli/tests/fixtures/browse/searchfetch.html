<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Search Fetch</title></head>
<body>
<nav>Home · Careers · Teams · Locations · Benefits · Students and graduates · Veterans · Accessibility · Contact us</nav>
<form><label>Search jobs by title, keyword or location <input name="q" value="trainee"></label><button>Search</button></form>
<p>Use the filters to narrow your search by state, work setting and job level.</p>
<main id="results"></main>
<script>
  const api = new URLSearchParams(location.search).get("api");
  fetch(api).then((response) => response.json()).then((jobs) => {
    document.getElementById("results").innerHTML = jobs.map((job) => `<article>${job}</article>`).join("");
  });
</script>
</body>
</html>
