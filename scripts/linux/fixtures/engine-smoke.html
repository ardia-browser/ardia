<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Engine smoke</title>
    <style>
      html { background: #18a0e0; }
      body { margin: 0; font: 16px sans-serif; color: #fff; min-height: 4000px; }
      input { position: fixed; left: 40px; bottom: 40px; width: 240px; font-size: 18px; }
    </style>
  </head>
  <body>
    <p id="count">clicks 0</p>
    <input id="field" placeholder="type here" />
    <script>
      window.clicks = 0;
      addEventListener("mousedown", (event) => {
        if (event.target.id === "field") return;
        window.clicks += 1;
        document.getElementById("count").textContent = `clicks ${window.clicks}`;
        document.title = `Engine smoke ${window.clicks}`;
      });
    </script>
  </body>
</html>
