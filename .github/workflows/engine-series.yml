name: Engine series

on:
  pull_request:
    paths: &series
      - "engine/patches/**"
      - "engine/chromium/**"
      - "engine/ardiacore/apply.sh"
      - "engine/ardiacore/src/ardia/core/**"
      - "engine/ardiacore-desktop/apply.sh"
      - "engine/ardiacore-linux/apply.sh"
      - "engine/ardiacore-linux/copies.tsv"
      - "packages/ardiacore/ios/page_script.js"
      - "packages/core-rs/**"
      - "scripts/engine/**"
      - ".github/workflows/engine-series.yml"
  push:
    branches: [main]
    paths: *series
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-series-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.vouch.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - id: vouch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const vouch = require(`${process.env.GITHUB_WORKSPACE}/.github/vouch/vouch.cjs`);
            await vouch.gate({ github, context, core });

  series:
    name: Series applies with zero fuzz (linux, mac)
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.run == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: The commit this change starts from
        id: since
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          elif git fetch -q --depth=1 origin "$BEFORE"; then
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::couldn't fetch $BEFORE, the commit this push starts from, so its edited patches can't be named"
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ardia/series-base
          key: series-base-${{ hashFiles('scripts/engine/series-bases.tsv', 'engine/patches/build/env.sh', 'engine/patches/build/helium-pins.ini') }}
          restore-keys: series-base-
      - name: Checker tests
        run: python3 -m unittest discover -s scripts/engine/tests -v
      - name: Every step applies to the published series base with zero fuzz; patches this change edits land exactly
        env:
          SINCE: ${{ steps.since.outputs.ref }}
        run: python3 scripts/engine/series-zero-fuzz.py --platform all --offsets warn --strict-since "$SINCE"
