name: Linux

on:
  push:
    branches: [linux, linux-dev]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xfwm4 dbus-x11 libxtst6 libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libcups2t64 libxkbcommon0 libsecret-1-0 jq x11-utils
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm -C apps/browser/linux typecheck
          pnpm -C packages/expo-linux typecheck
      - name: Unit tests
        run: |
          pnpm -C apps/browser/linux test
          pnpm -C apps/browser test
      - name: Prebuilt engine
        id: prebuilt
        run: |
          jq -e --arg arch ${{ matrix.arch }} '.[$arch].asset' scripts/linux/engine/prebuilt.json > /dev/null
          jq -r '"engine: \(.release), Chromium \(.chromium)"' scripts/linux/engine/prebuilt.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch the engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/linux/fetch-engine.sh ${{ matrix.arch }} "$RUNNER_TEMP/engine/ardia-chromium-linux-${{ matrix.arch }}.tar.xz"
      - name: Build the UI
        run: pnpm -C apps/browser/linux build
      - name: Package
        run: |
          node scripts/linux/package-engine.mjs --arch ${{ matrix.arch }} --target all \
            --engine "$RUNNER_TEMP/engine/ardia-chromium-linux-${{ matrix.arch }}.tar.xz" --ui apps/browser/linux/ui \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the .deb
        run: |
          deb=$(ls apps/browser/linux/dist/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'opt/Ardia/(ardia|ardia.bin|chrome-sandbox|ardia.build.json|ui/index.html)$'
          dpkg-deb -c "$deb" | grep -E '^-rwsr-xr-x root/root .* \./opt/Ardia/chrome-sandbox$'
          dpkg-deb -e "$deb" "$RUNNER_TEMP/deb-control"
          grep -q 'chmod 4755' "$RUNNER_TEMP/deb-control/postinst"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          grep -q '^StartupWMClass=ardia$' "$RUNNER_TEMP"/deb-root/usr/share/applications/ardia.desktop
          grep -q 'x-scheme-handler/https' "$RUNNER_TEMP"/deb-root/usr/share/applications/ardia.desktop
          ! find "$RUNNER_TEMP/deb-root/opt/Ardia/ui" -name '*.map' | grep -q .
      - name: Smoke the AppImage
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cp apps/browser/linux/dist/*.AppImage "$RUNNER_TEMP/appimage/"
          (cd "$RUNNER_TEMP/appimage" && ./*.AppImage --appimage-extract > /dev/null)
          dir="$RUNNER_TEMP/appimage/squashfs-root"
          touch "$dir/ardia.test-build"
          scripts/linux/engine-smoke --engine "$dir" --ui "$dir/ui" --out "$RUNNER_TEMP/smoke-appimage" --rates 10 --display 132 --port 9390
      - name: Smoke the .deb
        timeout-minutes: 10
        run: |
          dir="$RUNNER_TEMP/deb-root/opt/Ardia"
          touch "$dir/ardia.test-build"
          scripts/linux/engine-smoke --engine "$dir" --ui "$dir/ui" --out "$RUNNER_TEMP/smoke-deb" --rates 10 --display 133 --port 9391
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/smoke-*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-linux-${{ matrix.arch }}
          path: |
            apps/browser/linux/dist/*.AppImage
            apps/browser/linux/dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
