[package]
name = "ardia-plugin-integration"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ardia-plugins"
path = "src/main.rs"
test = false

[[test]]
name = "real_host"
path = "tests/real_host.rs"

[dependencies]
ardia-plugin-host = { path = "../host" }
ardia-plugin-jail = { path = "../jail" }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
