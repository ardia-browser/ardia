id: dropped-task
language: rust
severity: error
message: "a gpui Task bound to _ is dropped at once, which cancels the work"
note: "Call .detach() (or .detach_and_log_err(cx)), or keep the Task in a field to cancel it later (gpui-code-quality: Detach or Store Tasks)."
ignores:
  - third_party/**
rule:
  any:
    - pattern: let _ = $C.spawn($$$);
    - pattern: let _ = $C.background_spawn($$$);
    - pattern: let _ = $C.spawn_in($$$);
    - pattern: let _ = $C.timer($$$);
    - pattern: let _task = $C.spawn($$$);
  not:
    has:
      stopBy: end
      kind: scoped_identifier
      regex: ^(std::)?(thread::Builder|process::Command)
constraints:
  C:
    regex: ^(cx|window|app|this|.*executor\(\))$
