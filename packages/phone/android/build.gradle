plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.plugin.compose'
}

group = 'com.ardia.phone'
version = '0.0.0'

def repository = file("${projectDir}/../../..")
def syncBundle = file("${repository}/packages/phone/ios/ArdiaKit/Sources/ArdiaShared/Scripts/ardia-sync.js")
def syncFixtures = file("${repository}/packages/sync/tests/fixtures")
def phoneSchema = file("${repository}/apps/phone/src/state/store/schema.ts")
def cameraXVersion = '1.6.0'
def kotlinVersion = org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project)
def architectures = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',').collect { it.trim() }
def reactNative = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).parentFile

abstract class CompileSyncBundle extends DefaultTask {
  static final String HERMES_VERSION = '260318099.0.5'
  static final Map<String, String> HERMESC_SHA256 = [
    'osx-bin/hermesc': '692d632cd4093b5225ed9194de0c223a9129b1f852515a0d86907e834c57950e',
    'linux64-bin/hermesc': '779ca1886d05cb2f6cda2e90d6ec5dfb0f69563a1734c9404c955009876a6f50',
    'win64-bin/hermesc.exe': '8b65a5a2d61379d32eacf516c4cf0ee7799d5d45c1720bebe75ff6f250915754',
  ]
  static final byte[] HERMES_BYTECODE_MAGIC = [(byte) 0xC6, (byte) 0x1F, (byte) 0xBC, (byte) 0x03, (byte) 0xC1, (byte) 0x03, (byte) 0x19, (byte) 0x1F] as byte[]

  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getBundle()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getHermesc()
  @Input abstract Property<String> getHermescPath()
  @Input abstract Property<String> getCompilerVersion()
  @Input abstract Property<String> getEngineVersion()
  @InputFiles @PathSensitive(PathSensitivity.NONE) abstract ConfigurableFileCollection getCompanionHooks()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getCompanionTests()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getRuntimeChecks()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getMakeChecksScript()
  @Input abstract Property<Boolean> getLab()
  @OutputDirectory abstract DirectoryProperty getOutputDir()
  @Inject abstract ExecOperations getExec()

  @TaskAction
  void compile() {
    if (compilerVersion.get() != HERMES_VERSION || engineVersion.get() != HERMES_VERSION) throw new GradleException("ardia-sync.hbc is pinned to Hermes ${HERMES_VERSION}, found hermes-compiler ${compilerVersion.get()} and React Native's Hermes ${engineVersion.get()}")
    def compiler = hermesc.get().asFile
    def expected = HERMESC_SHA256[hermescPath.get()]
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(compiler.bytes).encodeHex().toString()
    if (expected == null || actual != expected) throw new GradleException("${compiler} is not hermes-compiler ${HERMES_VERSION}'s hermesc: sha256 ${actual}")
    def work = new File(temporaryDir, 'work')
    work.deleteDir()
    work.mkdirs()
    def source = bundle.get().asFile
    def bytecode = new File(work, 'ardia-sync.hbc')
    def register = companionHooks.files.find { it.name == 'sync-bundle-register.mjs' }
    exec.exec {
      environment 'ARDIA_SYNC_BUNDLE', source.absolutePath
      commandLine 'node', '--import', register.toURI().toString(), '--test', '--test-reporter=dot', companionTests.get().asFile.absolutePath
    }
    hermes(compiler, source, bytecode)
    checkBytecode(bytecode)
    def results = [bytecode]
    if (lab.get()) {
      exec.exec { commandLine 'node', makeChecksScript.get().asFile.absolutePath, runtimeChecks.get().asFile.absolutePath, work.absolutePath }
      def checksBytecode = new File(work, 'ardia-sync-checks.hbc')
      hermes(compiler, new File(work, 'ardia-sync-checks.js'), checksBytecode)
      checkBytecode(checksBytecode, 256)
      results += [checksBytecode, new File(work, 'ardia-sync-checks.json')]
    }
    def out = outputDir.get().asFile
    out.mkdirs()
    def names = results*.name as Set
    out.listFiles()?.findAll { !(it.name in names) }?.each { it.delete() }
    results.each { result ->
      def staged = new File(out, "${result.name}.partial")
      java.nio.file.Files.copy(result.toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      java.nio.file.Files.move(staged.toPath(), new File(out, result.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    }
  }

  void hermes(File compiler, File input, File output) {
    exec.exec { commandLine compiler.absolutePath, '-emit-binary', '-O', '-Xes6-block-scoping', '-w', '-out', output.absolutePath, input.absolutePath }
  }

  private static void checkBytecode(File bytecode, long smallest = 1024) {
    def head = new byte[8]
    bytecode.withInputStream { it.read(head) }
    if (bytecode.length() < smallest || !Arrays.equals(head, HERMES_BYTECODE_MAGIC)) throw new GradleException("hermesc wrote no Hermes bytecode to ${bytecode}")
  }
}

def hermescPath = System.getProperty('os.name').toLowerCase().contains('mac') ? 'osx-bin/hermesc' : (System.getProperty('os.name').toLowerCase().contains('win') ? 'win64-bin/hermesc.exe' : 'linux64-bin/hermesc')
def hermesCompiler = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).parentFile
def hermesCompilerVersion = new groovy.json.JsonSlurper().parse(new File(hermesCompiler, 'package.json')).version
def hermesEngineVersion = new File(reactNative, 'sdks/hermes-engine/version.properties').readLines().find { it.startsWith('HERMES_VERSION_NAME=') }?.substring('HERMES_VERSION_NAME='.length())?.trim() ?: 'unknown'

androidComponents {
  onVariants(selector().all()) { variant ->
    def task = tasks.register("compile${variant.name.capitalize()}SyncBundle", CompileSyncBundle) {
      bundle.set(syncBundle)
      hermesc.set(new File(hermesCompiler, "hermesc/${hermescPath}"))
      it.hermescPath.set(hermescPath)
      compilerVersion.set(hermesCompilerVersion)
      engineVersion.set(hermesEngineVersion)
      companionHooks.from(file("${projectDir}/scripts/sync-bundle-register.mjs"), file("${projectDir}/scripts/sync-bundle-hooks.mjs"))
      companionTests.set(file("${repository}/packages/sync/src/companion/companion.test.ts"))
      runtimeChecks.set(file("${projectDir}/scripts/sync-runtime-checks.js"))
      makeChecksScript.set(file("${projectDir}/scripts/make-sync-checks.mjs"))
      lab.set(findProperty('ardiaLab') == 'true')
    }
    variant.sources.assets?.addGeneratedSourceDirectory(task, { CompileSyncBundle compile -> compile.outputDir })
    variant.packaging.jniLibs.excludes.addAll([
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libhermes.so",
      "**/libhermesvm.so",
      "**/libhermestooling.so",
      "**/libreactnative.so",
    ])
  }
}

android {
  namespace "com.ardia.browser"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DARDIA_SCRIPT_SHIM=${projectDir}/src/main/cpp/ardia_hermes.cpp", "-DARDIA_SCRIPT_LOGS=${findProperty('ardiaLab') == 'true' ? 'ON' : 'OFF'}"
        abiFilters(*architectures)
        targets "ardiahermes"
      }
    }
    buildConfigField "boolean", "ARDIA_LAB", (findProperty('ardiaLab') == 'true').toString()
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  buildFeatures {
    prefab true
    buildConfig true
    compose true
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }
  buildTypes {
    debug {
      externalNativeBuild {
        cmake {
          arguments "-DHERMES_ENABLE_DEBUGGER=1"
        }
      }
    }
  }
  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.includeAndroidResources = true
    unitTests.all { test ->
      test.systemProperty("ardia.syncFixtures", syncFixtures.absolutePath)
      test.inputs.dir(syncFixtures).withPropertyName("syncFixtures").withPathSensitivity(PathSensitivity.RELATIVE)
      test.systemProperty("ardia.phoneSchema", phoneSchema.absolutePath)
      test.inputs.file(phoneSchema).withPropertyName("phoneSchema").withPathSensitivity(PathSensitivity.RELATIVE)
      test.inputs.dir(file("../ios/ArdiaKit/Sources/ArdiaBrowser/Web")).withPropertyName("iphonePageScripts").withPathSensitivity(PathSensitivity.RELATIVE)
      findProperty('ardiaBlockingLists')?.with { lists ->
        test.systemProperty("ardia.blockingLists", lists)
        test.inputs.files(lists).withPropertyName("blockingLists").withPathSensitivity(PathSensitivity.RELATIVE)
      }
      System.getenv('ARDIA_SYNC_VECTORS_WRITE')?.with { target ->
        test.environment('ARDIA_SYNC_VECTORS_WRITE', target)
        test.outputs.upToDateWhen { false }
      }
      test.filter.failOnNoMatchingTests = false
    }
  }
}

dependencies {
  kotlinCompilerPluginClasspath "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable:${kotlinVersion}"
  implementation "com.facebook.react:react-android"
  implementation "com.facebook.react:hermes-android"
  implementation "androidx.annotation:annotation:1.9.1"
  implementation "androidx.activity:activity:1.13.0"
  implementation "androidx.core:core:1.16.0"
  implementation "androidx.webkit:webkit:1.18.0"
  implementation "androidx.work:work-runtime-ktx:2.10.5"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "androidx.browser:browser:1.10.0"
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
  implementation "com.google.re2j:re2j:1.8"
  implementation "androidx.camera:camera-core:${cameraXVersion}"
  implementation "androidx.camera:camera-camera2:${cameraXVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
  implementation "androidx.camera:camera-view:${cameraXVersion}"
  implementation "com.google.zxing:core:3.5.4"
  implementation project(":ardia-design")
  implementation(findProject(":expo-ui") ?: "expo.modules.ui:expo.modules.ui:+")
  implementation(findProject(":expo-sqlite") ?: "host.exp.exponent:expo.modules.sqlite:+")
  implementation "androidx.compose.foundation:foundation-android:1.12.1"
  implementation "androidx.compose.ui:ui-android:1.12.1"
  implementation "androidx.compose.material3:material3:1.5.0-beta01"
  implementation "androidx.compose.ui:ui-text:1.7.8"
  compileOnly "com.google.guava:guava:33.3.1-android"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
  testImplementation "org.xerial:sqlite-jdbc:3.41.2.2"
  testImplementation "org.robolectric:robolectric:4.17"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
  androidTestImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test:core:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
