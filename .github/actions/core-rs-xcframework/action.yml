name: Rust core framework
description: Installs the toolchain in packages/core-rs/rust-toolchain.toml with rustup, then builds ArdiaCoreRS.xcframework (the sync core and the import parsers) for the Mac, iPhone and simulator into packages/sync/ios/Frameworks
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          packages/core-rs/target
        key: core-rs-apple-${{ runner.os }}-${{ hashFiles('packages/core-rs/rust-toolchain.toml', 'packages/core-rs/Cargo.lock', 'packages/core-rs/crates/ardia-crypto/**', 'packages/core-rs/crates/ardia-sync-core/**', 'packages/core-rs/crates/ardia-ffi/**', 'packages/core-rs/crates/ardia-import-core/**', 'packages/core-rs/crates/ardia-import-ffi/**', 'packages/core-rs/crates/ardia-apple-ffi/**') }}
        restore-keys: core-rs-apple-${{ runner.os }}-
    - name: Build ArdiaCoreRS.xcframework
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        PATH="$HOME/.cargo/bin:$PATH" packages/core-rs/scripts/build-xcframework.sh
